apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stg-admin-lawyered
  namespace: argo-cd
  labels:
    app: stg-admin-lawyered
    tier: application
    environment: stg
spec:
  project: default
  source:
    repoURL: git@github.com:Lawyered-in/k8s-manifest.git
    targetRevision: staging
    path: deployments/stg-admin-lawyered
  destination:
    server: https://kubernetes.default.svc
    namespace: stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/1/image
  revisionHistoryLimit: 3
