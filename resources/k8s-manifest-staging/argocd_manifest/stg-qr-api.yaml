apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stg-qr-api
  namespace: argo-cd
  labels:
    app: stg-qr-api
    tier: application
    environment: stg
spec:
  project: default
  source:
    repoURL: git@github.com:Lawyered-in/k8s-manifest.git
    targetRevision: staging
    path: deployments/stg-qr-api
  destination:
    server: https://kubernetes.default.svc
    namespace: stg
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
