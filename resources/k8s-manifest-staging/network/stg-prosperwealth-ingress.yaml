apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stg-prosperwealth-ingress
  namespace: stg
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:344367180480:certificate/ed6f5e4a-e23f-4512-ba8c-e1a2441e0d4d
    alb.ingress.kubernetes.io/group.name: laweryerd-np-group
    alb.ingress.kubernetes.io/group.order: "80"
    alb.ingress.kubernetes.io/load-balancer-name: lawyered-ingress-alb
    alb.ingress.kubernetes.io/success-codes: "200,301,302,404"
spec:
  rules:
    - host: staging-be.prosperwealth.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stg-faas-be
                port:
                  number: 80
