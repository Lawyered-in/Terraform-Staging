apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stg-lawyered-ingress
  namespace: stg
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:344367180480:certificate/98c8d8d0-1e46-4a81-967a-84555529f2c3
    alb.ingress.kubernetes.io/group.name: laweryerd-np-group
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/success-codes: "200,301,302,404"
    alb.ingress.kubernetes.io/load-balancer-name: lawyered-ingress-alb
spec:
  rules:

  # ── stg.lawyered.in ────────────────────────────────────────────────────────
  - host: stg.lawyered.in
    http:
      paths:

        # ── CORS image paths → nginx sidecar on stg-admin-lawyered ──────────
        # Sidecar injects CORS headers then forwards to app on :3000
        - path: /customerAssets/images
          pathType: Prefix
          backend:
            service:
              name: stg-admin-lawyered
              port:
                number: 80

        - path: /uploads
          pathType: Prefix
          backend:
            service:
              name: stg-admin-lawyered
              port:
                number: 80

        # ── Next.js static assets ────────────────────────────────────────────
        - path: /_next
          pathType: Prefix
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Favicon ──────────────────────────────────────────────────────────
        - path: /favicon.ico
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Static media files ───────────────────────────────────────────────
        - path: /lots.mp4
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        - path: /sketch.png
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Corporate pages ──────────────────────────────────────────────────
        - path: /about
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        - path: /ceo-message
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        - path: /contact
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        - path: /privacy-policy
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        - path: /terms-and-conditions
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Product pages ────────────────────────────────────────────────────
        - path: /lots-247
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        - path: /challan-pay
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Blog section ─────────────────────────────────────────────────────
        - path: /blogs
          pathType: Prefix
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Challan API → nginx sidecar on stg-api-challans ─────────────────
        # Sidecar strips /challanapi prefix before forwarding to app
        - path: /challanapi
          pathType: Prefix
          backend:
            service:
              name: stg-api-challans
              port:
                number: 80

        # ── Homepage (Exact wins over Prefix catch-all below) ────────────────
        - path: /
          pathType: Exact
          backend:
            service:
              name: stg-lawyered-in-website
              port:
                number: 80

        # ── Default fallback → stg-admin-lawyered ───────────────────────────
        - path: /
          pathType: Prefix
          backend:
            service:
              name: stg-admin-lawyered
              port:
                number: 80

  # ── stg-partners.lawyered.in ───────────────────────────────────────────────
  - host: stg-partners.lawyered.in
    http:
      paths:

        # ── Challan API for partners domain ──────────────────────────────────
        - path: /challanapi
          pathType: Prefix
          backend:
            service:
              name: stg-api-challans
              port:
                number: 80

        # ── Partners portal frontend ─────────────────────────────────────────
        - path: /
          pathType: Prefix
          backend:
            service:
              name: stg-partners-portal-fe
              port:
                number: 80

  # ── staging-be.lawyered.in ─────────────────────────────────────────────────
  - host: staging-be.lawyered.in
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: stg-lawyered-be
              port:
                number: 80

  # ── staging-subscribers.lawyered.in ───────────────────────────────────────
  - host: staging-subscribers.lawyered.in
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: stg-subscriber-fe
              port:
                number: 80
