apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-lawyered-secret
  namespace: stg
  labels:
    app: admin-lawyered
    environment: staging
    managed-by: external-secrets-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager-stg
    kind: ClusterSecretStore
  target:
    name: admin-lawyered-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: staging/admin-lawyered

