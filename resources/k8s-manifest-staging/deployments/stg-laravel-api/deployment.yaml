apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-laravel-api
  namespace: stg
  labels:
    app: stg-laravel-api
    environment: stg

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: stg-laravel-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: stg-laravel-api
        environment: stg

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: stg-laravel-api
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/laravel-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          envFrom:
            - secretRef:
                name: laravel-api-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"
