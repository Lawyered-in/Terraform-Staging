apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stg-expert-app-hpa
  namespace: stg
  labels:
    app: stg-expert-app
    environment: stg
  annotations:
    description: "Static nginx frontend - light CPU-based scaling for staging"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stg-expert-app
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
