apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-expert-app
  namespace: stg
  labels:
    app: stg-expert-app
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-expert-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-expert-app
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      # nginxinc/nginx-unprivileged runs as nginx (UID/GID 101) and listens on 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stg-expert-app
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/expert-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          # Static Expo web export only. EXPO_PUBLIC_API_URL is baked into the
          # bundle at build time (CodePipeline build_args), so there are no
          # runtime env vars or secrets to mount.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp/cache dirs in /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
