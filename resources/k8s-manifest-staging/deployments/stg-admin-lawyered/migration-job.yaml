apiVersion: batch/v1
kind: Job
metadata:
  name: admin-lawyered-migrate-fdaa26a
  namespace: stg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/admin-lawyered:fdaa26a
          command: ["/bin/sh", "-c"]
          args:
            - npm run generate && npm run migrate:deploy && npm run generate
          env:
            - name: DATABASE_URL
              value: "mysql://admin:2QK%7CDx-q%23%23%3AE%3ALSk(HG%5Dvm%3A1%3AIcZ@lawyered-database.cluster-cj446ammul0i.ap-south-1.rds.amazonaws.com:3306/proddblawyered"
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
