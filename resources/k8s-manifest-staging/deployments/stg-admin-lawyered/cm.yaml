apiVersion: v1
kind: ConfigMap
metadata:
  name: stg-admin-lawyered-nginx-config
  namespace: stg
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      # Increase buffer sizes for large responses
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;

      server {
        listen 80;

        # ── CORS for customerAssets images ──────────────────────────────────
        location ~* ^/customerAssets/images/.*\.(png|jpg|jpeg|gif|webp)$ {
          proxy_pass http://localhost:3000;

          proxy_set_header Host               $host;
          proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP          $remote_addr;
          proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
          proxy_set_header X-Forwarded-Host   $host;

          proxy_hide_header Access-Control-Allow-Origin;
          proxy_hide_header Cross-Origin-Resource-Policy;

          add_header Access-Control-Allow-Origin * always;
          add_header Access-Control-Allow-Methods GET always;
          add_header Access-Control-Allow-Headers * always;
          add_header Cross-Origin-Resource-Policy cross-origin always;

          proxy_buffering on;
          proxy_read_timeout 600s;
          proxy_connect_timeout 600s;
          proxy_send_timeout 600s;
        }

        # ── CORS for uploads images ──────────────────────────────────────────
        location ~* ^/uploads/.*\.(png|jpg|jpeg|gif|webp)$ {
          proxy_pass http://localhost:3000;

          proxy_set_header Host               $host;
          proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP          $remote_addr;
          proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
          proxy_set_header X-Forwarded-Host   $host;

          proxy_hide_header Access-Control-Allow-Origin;
          proxy_hide_header Cross-Origin-Resource-Policy;

          add_header Access-Control-Allow-Origin * always;
          add_header Access-Control-Allow-Methods GET always;
          add_header Access-Control-Allow-Headers * always;
          add_header Cross-Origin-Resource-Policy cross-origin always;

          proxy_buffering on;
          proxy_read_timeout 600s;
          proxy_connect_timeout 600s;
          proxy_send_timeout 600s;
        }

        # ── Health check for ALB target health ──────────────────────────────
        location /nginx-health {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        # ── Everything else → passthrough to app ────────────────────────────
        location / {
          proxy_pass http://localhost:3000;
          client_max_body_size 500M;

          proxy_set_header Host               $host;
          proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP          $remote_addr;
          proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
          proxy_set_header X-Forwarded-Host   $host;

          # WebSocket / Socket.io support
          proxy_http_version 1.1;
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection "upgrade";

          proxy_buffering on;
          proxy_read_timeout 600s;
          proxy_connect_timeout 600s;
          proxy_send_timeout 600s;
        }
      }
    }