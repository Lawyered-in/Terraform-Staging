apiVersion: batch/v1
kind: Job
metadata:
  name: coworking-platform-be-migrate-a821af0
  namespace: stg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/coworking-platform-be:a821af0
          command: ["npm", "run", "db:migrate:typeorm"]
          envFrom:
            - secretRef:
                name: coworking-platform-be-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
