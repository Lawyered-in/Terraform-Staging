apiVersion: batch/v1
kind: Job
metadata:
  name: coworking-platform-be-migrate-a821af0
  namespace: stg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/coworking-platform-be:a821af0
          command: ["npm", "run", "db:migrate:typeorm"]
          env:
            - name: DB_DATABASE
              value: "cow_dev_db"
            - name: DB_HOST
              value: "core-uat-db.cj446ammul0i.ap-south-1.rds.amazonaws.com"
            - name: DB_USERNAME
              value: "dbadmin"
            - name: DB_PORT
              value: "5432"
            - name: DB_PASSWORD
              value: "SecureTempPassword123!"
            - name: PGSSLMODE
              value: "require"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
