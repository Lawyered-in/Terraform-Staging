apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-lawyered-in-website
  namespace: stg
  labels:
    app: stg-lawyered-in-website
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-lawyered-in-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-lawyered-in-website
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stg-lawyered-in-website
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/lawyered-in-website:031d611
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: lawyered-in-website-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

