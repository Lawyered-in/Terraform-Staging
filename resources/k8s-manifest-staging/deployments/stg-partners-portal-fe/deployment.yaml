apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-partners-portal-fe
  namespace: stg
  labels:
    app: stg-partners-portal-fe
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-partners-portal-fe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-partners-portal-fe
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stg-partners-portal-fe
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/partners-portal-fe:5dc6ea1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: partners-portal-fe-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

