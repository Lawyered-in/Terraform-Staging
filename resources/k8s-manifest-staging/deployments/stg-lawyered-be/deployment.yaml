apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-lawyered-be
  namespace: stg
  labels:
    app: stg-lawyered-be
    environment: stg

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: stg-lawyered-be

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: stg-lawyered-be
        environment: stg

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: stg-lawyered-be
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/lawyered-be:97ce507
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: lawyered-be-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"
