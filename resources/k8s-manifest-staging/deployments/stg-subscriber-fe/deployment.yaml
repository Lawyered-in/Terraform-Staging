apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-subscriber-fe
  namespace: stg
  labels:
    app: stg-subscriber-fe
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-subscriber-fe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-subscriber-fe
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stg-subscriber-fe
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/subscriber-fe:cea9061
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: subscriber-fe-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
