apiVersion: batch/v1
kind: Job
metadata:
  name: core-platform-be-migrate-80b8543
  namespace: stg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/core-platform-be:80b8543
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: core-platform-be-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"