apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-faas-be
  namespace: stg
  labels:
    app: stg-faas-be
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-faas-be
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-faas-be
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stg-faas-be
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/faas-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: faas-be-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
