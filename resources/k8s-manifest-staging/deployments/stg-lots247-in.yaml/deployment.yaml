apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-lots247-in
  namespace: stg
  labels:
    app: stg-lots247-in
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-lots247-in
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-lots247-in
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stg-lots247-in
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/lots247-in:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: lots247-in-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
