apiVersion: batch/v1
kind: Job
metadata:
  name: api-challans-migrate-7f6369c
  namespace: stg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/api-challans:7f6369c
          command: ["npx", "prisma", "migrate", "deploy", "&&", "npx", "prisma", "generate"]
          envFrom:
            - secretRef:
                name: api-challans-secret
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
