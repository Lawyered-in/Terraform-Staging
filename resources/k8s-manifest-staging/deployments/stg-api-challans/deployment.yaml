apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-api-challans
  namespace: stg
  labels:
    app: stg-api-challans
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-api-challans
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-api-challans
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:

        # â”€â”€ nginx sidecar (receives all traffic, proxies to app on :3000) â”€â”€â”€â”€
        - name: nginx-proxy
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        - name: stg-api-challans
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/api-challans:7f6369c
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: api-challans-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

      volumes:
        - name: nginx-config                          # â† added
          configMap:
            name: stg-api-challans-nginx-config
