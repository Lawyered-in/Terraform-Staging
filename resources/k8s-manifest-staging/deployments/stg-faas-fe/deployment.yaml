apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-faas-fe
  namespace: stg
  labels:
    app: stg-faas-fe
    environment: stg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stg-faas-fe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stg-faas-fe
        environment: stg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stg-faas-fe
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/faas-fe:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Note: VITE_* vars are baked in at Docker build time (--build-arg).
          # Values here are for reference/documentation only and have no runtime effect.
          envFrom:
            - secretRef:
                name: faas-fe-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
