# ============================================================
# ArgoCD Application Manifest â€” coworking-platform-fe
# ------------------------------------------------------------
# This tells ArgoCD to watch the k8s-manifest GitHub repo
# (staging branch) and automatically deploy whatever is inside
# deployments/stg-coworking-platform-fe/ into the EKS cluster.
#
# Flow:
#   CodePipeline builds image â†’ pushes to ECR
#   â†’ updates deployment.yaml in k8s-manifest (staging branch)
#   â†’ ArgoCD detects the change here â†’ deploys to EKS namespace stg
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stg-coworking-platform-fe      # ArgoCD app name shown in UI
  namespace: argo-cd                   # ArgoCD lives in the argo-cd namespace
  labels:
    app: stg-coworking-platform-fe
    tier: application
    environment: stg
spec:
  project: default

  # Source: which Git repo + branch + folder ArgoCD watches
  source:
    repoURL: git@github.com:Lawyered-in/k8s-manifest.git
    targetRevision: staging            # watches the staging branch
    path: deployments/stg-coworking-platform-fe  # folder containing deployment.yaml

  # Destination: where in EKS to deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: stg                     # deploys into the stg namespace

  # SyncPolicy: automated â€” ArgoCD will auto-sync on every git change
  syncPolicy:
    automated:
      prune: true                      # removes resources deleted from git
      selfHeal: true                   # re-applies if someone manually changes cluster state
    syncOptions:
      - CreateNamespace=true           # creates stg namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true           # safer apply â€” avoids immutable field errors

  revisionHistoryLimit: 3             # keep last 3 sync history entries
