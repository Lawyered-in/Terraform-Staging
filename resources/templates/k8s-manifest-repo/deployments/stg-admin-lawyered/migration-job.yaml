apiVersion: batch/v1
kind: Job
metadata:
  name: admin-lawyered-migrate-b4d4820
  namespace: stg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: 344367180480.dkr.ecr.ap-south-1.amazonaws.com/admin-lawyered:b4d4820
          command: ["/bin/sh", "-c"]
          args:
            - npm run generate && npm run migrate:deploy && npm run generate
          envFrom:
            - secretRef:
                name: admin-lawyered-secret
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
